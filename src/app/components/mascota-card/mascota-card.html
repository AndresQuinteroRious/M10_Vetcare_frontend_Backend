<div class="card">
  <div class="card-foto-contenedor">
    <img class="card-foto" [src]="foto" [alt]="'Foto de ' + nombre">
    <button
      class="favorito-boton"
      type="button"
      [attr.aria-pressed]="esFavorito"
      [attr.aria-label]="esFavorito ? 'Quitar de favoritos' : 'Agregar a favoritos'"
      (click)="alClicFavorito($event)">
      <span class="favorito-icono" [class.activo]="esFavorito">♥</span>
    </button>
  </div>
  <div class="card-cuerpo">
    <h3 class="card-nombre">{{ nombre }}</h3>
    <p class="card-datos">{{ especie }} · {{ edad }} años</p>
  </div>
</div>
