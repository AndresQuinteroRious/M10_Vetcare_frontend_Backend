<section class="notificaciones" aria-live="polite" aria-label="Notificaciones">
  @for (aviso of notificaciones(); track aviso.id) {
    <div
      class="notificacion"
      [class]="'notificacion-' + aviso.tipo"
      [attr.role]="aviso.tipo === 'error' ? 'alert' : 'status'">
      <app-icono [nombre]="aviso.tipo === 'error' ? 'alerta' : 'check'" />
      <p class="notificacion-texto">{{ aviso.mensaje }}</p>
      <button type="button" class="notificacion-cerrar" aria-label="Cerrar aviso" (click)="cerrar(aviso.id)">
        <app-icono nombre="cerrar" [tamano]="16" />
      </button>
    </div>
  }
</section>
