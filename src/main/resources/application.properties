spring.application.name=vetcare
spring.datasource.url=jdbc:postgresql://localhost:5432/vetcare_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#server.port=8080

# Clave secreta para firmar los JWT (en produccion iria en variable de entorno)
jwt.secret=EstaEsUnaClaveSecretaMuyLargaParaVetCare2026SeguridadJWT
# Duracion del token en milisegundos (aqui, 24 horas)
jwt.expiration=86400000